name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish v<VERSION> as a GitHub pre-release from this commit"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -d main.go; gofmt -l .; exit 1; }
      - name: Build (vet, tests, 3 targets, selftest)
        run: ./build.sh
      - name: Package
        id: pkg
        run: |
          V=$(cat VERSION)
          (cd dist && zip -qr "UrsidoRescue-$V.zip" "UrsidoRescue-$V" && sha256sum "UrsidoRescue-$V.zip" > "UrsidoRescue-$V.zip.sha256")
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: UrsidoRescue-${{ steps.pkg.outputs.version }}
          path: dist/UrsidoRescue-${{ steps.pkg.outputs.version }}
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish prerelease]'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.pkg.outputs.version }}
          TAG="v$V"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION $V"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"; exit 1
          fi
          # From a manual run the tag is created on the exact commit that was just built and tested.
          gh release create "$TAG" \
            "dist/UrsidoRescue-$V.zip" "dist/UrsidoRescue-$V.zip.sha256" \
            --prerelease --title "UrsidoRescue $V" --notes-file STATUS.md --target "$GITHUB_SHA"
