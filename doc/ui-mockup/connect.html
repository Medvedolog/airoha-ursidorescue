<h2>Подключите USB-UART</h2>
<p>Нажмите на чип порта вверху слева, чтобы выбрать COM-порт. Нужен адаптер 3,3 В: TX↔RX, RX↔TX, GND↔GND. Питание (VCC) не подключайте.</p>
<p>Если порта нет в списке — проверьте драйвер (CH340, CP210x, FTDI) и нажмите «Обновить».</p>
