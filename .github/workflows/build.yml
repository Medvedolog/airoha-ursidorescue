name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Build (vet, tests, 3 targets, selftest)
        run: ./build.sh
      - name: Package
        id: pkg
        run: |
          V=$(cat VERSION)
          (cd dist && zip -qr "UrsidoRescue-$V.zip" "UrsidoRescue-$V" && sha256sum "UrsidoRescue-$V.zip" > "UrsidoRescue-$V.zip.sha256")
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: UrsidoRescue-${{ steps.pkg.outputs.version }}
          path: dist/UrsidoRescue-${{ steps.pkg.outputs.version }}
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.pkg.outputs.version }}
          if [ "${GITHUB_REF_NAME}" != "v$V" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION $V"; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/UrsidoRescue-$V.zip" "dist/UrsidoRescue-$V.zip.sha256" \
            --prerelease --title "UrsidoRescue $V" --notes-file STATUS.md --verify-tag
